# Controlled local Roundcube + IMAP/SMTP for browser end-to-end tests.
# Synthetic test accounts and messages only; never connect real mail.
name: tlp-mail-marker-e2e

services:
  greenmail:
    image: greenmail/standalone:2.1.0
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.verbose
    ports:
      - '127.0.0.1:3143:3143'

  roundcube:
    image: roundcube/roundcubemail:1.6.19-apache
    environment:
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_DEFAULT_HOST: greenmail
      ROUNDCUBEMAIL_DEFAULT_PORT: '3143'
      ROUNDCUBEMAIL_SMTP_SERVER: greenmail
      ROUNDCUBEMAIL_SMTP_PORT: '3025'
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_USERNAME_DOMAIN: ''
    ports:
      - '127.0.0.1:8081:80'
    depends_on:
      - greenmail
